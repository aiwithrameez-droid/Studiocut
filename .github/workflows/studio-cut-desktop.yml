name: Build bundled StudioCut desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release to receive the bundled installers
        required: true
        default: studiocut-desktop-v1.1.0

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: macos-intel
            runner: macos-latest
            arch: x64
          - variant: macos-apple-silicon
            runner: macos-latest
            arch: arm64
          - variant: macos-intel-monterey
            runner: macos-latest
            arch: x64
          - variant: windows-x64
            runner: windows-latest
            arch: x64
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install editor dependencies
        working-directory: editor
        run: npm install --no-audit --no-fund
      - name: Build bundled local editor
        working-directory: editor
        run: npm run build
      - name: Copy local editor into desktop package
        run: mkdir -p dist && cp -R ../editor/dist/desktop dist/desktop
      - run: npm install --no-audit --no-fund
      - name: Smoke-test local editor without internet
        run: npx electron main.cjs --smoke-test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build macOS 13+ installer
        if: runner.os == 'macOS' && matrix.variant != 'macos-intel-monterey'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Build Intel Monterey installer
        if: matrix.variant == 'macos-intel-monterey'
        run: npx electron-builder --mac dmg zip --x64 --publish never -c.electronVersion=43.8.3 -c.mac.minimumSystemVersion=12.0.0 '-c.artifactName=StudioCut-${version}-${os}-${arch}-macos12.${ext}'
      - name: Verify the installer contains the editor and WASM
        run: node verify-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: studiocut-${{ matrix.variant }}
          path: |
            desktop/installers/*.dmg
            desktop/installers/*.zip
            desktop/installers/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-${{ matrix.variant }}
          path: desktop/desktop-startup.png
          if-no-files-found: error
      - name: Attach installers to draft release
        shell: bash
        run: |
          shopt -s nullglob
          files=(installers/*.dmg installers/*.zip installers/*.exe)
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber

  finish:
    needs: installers
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Make unsigned preview downloads available
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease
