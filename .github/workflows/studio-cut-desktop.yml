name: Build bundled StudioCut desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release to receive the bundled installers
        required: true
        default: studiocut-desktop-v1.2.6
      build_target:
        description: Build every installer, or retry Windows only
        type: choice
        options: [all, windows]
        default: all

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.variant }}
    runs-on: ${{ startsWith(matrix.variant, 'macos') && 'macos-latest' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.build_target == 'windows' && '["windows-x64"]' || '["macos-intel","macos-apple-silicon","macos-intel-monterey","windows-x64"]') }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_ARCH: ${{ matrix.variant == 'macos-apple-silicon' && 'arm64' || 'x64' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install editor dependencies
        working-directory: editor
        run: npm install --no-audit --no-fund
      - name: Build bundled local editor
        working-directory: editor
        run: npm run build
      - name: Copy local editor into desktop package
        run: mkdir -p dist && cp -R ../editor/dist/desktop dist/desktop
      - run: npm install --no-audit --no-fund
      - name: Smoke-test local editor without internet
        run: npx electron main.cjs --smoke-test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build macOS 13+ installer
        if: runner.os == 'macOS' && matrix.variant != 'macos-intel-monterey'
        run: npx electron-builder --mac dmg zip --"$BUILD_ARCH" --publish never
      - name: Build Intel Monterey installer
        if: matrix.variant == 'macos-intel-monterey'
        run: npx electron-builder --mac dmg zip --x64 --publish never -c.electronVersion=43.8.3 -c.mac.minimumSystemVersion=12.0.0 '-c.artifactName=StudioCut-${version}-${os}-${arch}-macos12.${ext}'
      - name: Verify the installer contains the editor and WASM
        run: node verify-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: studiocut-${{ matrix.variant }}
          path: |
            desktop/installers/*.dmg
            desktop/installers/*.zip
            desktop/installers/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-${{ matrix.variant }}
          path: desktop/desktop-startup.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failure-${{ matrix.variant }}
          path: desktop/desktop-failure.png
          if-no-files-found: ignore
      - name: Attach installers to draft release
        shell: bash
        run: |
          shopt -s nullglob
          files=(installers/*.dmg installers/*.zip installers/*.exe)
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber

  finish:
    needs: installers
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require all four installers before releasing
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' > names.txt
          for file in StudioCut-1.2.6-win-x64.exe StudioCut-1.2.6-mac-x64.dmg StudioCut-1.2.6-mac-arm64.dmg StudioCut-1.2.6-mac-x64-macos12.dmg; do
            grep -Fxq "$file" names.txt || { echo "Missing required installer: $file"; exit 1; }
          done
      - name: Make unsigned preview downloads available
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease
